name: VS Code Marketplace

# Publishes every platform's .vsix from GitHub's network. Each package bundles
# its own Bun (30-48 MB), and a slow home uplink outlasts the Marketplace's
# request limit for the larger Linux and Windows packages, which then never
# leave the machine. Already-published versions are skipped, so this is safe
# to run alongside a local publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.12"

jobs:
  publish:
    name: Publish to the VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Require the Marketplace token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Add a VSCE_PAT repository secret (Azure DevOps token, scope Marketplace > Manage) to publish."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches the extension version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("xerxes/package.json").json()).version)')"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match xerxes/package.json version $version."
            exit 1
          fi

      - name: Build every platform and publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bun xerxes/scripts/publishVscode.ts --skip-github
