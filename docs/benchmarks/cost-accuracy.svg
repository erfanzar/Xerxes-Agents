<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="SF Mono, Menlo, Consolas, monospace">
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1b1b1b">Cost vs. accuracy: Xerxes, Hermes and Pi</text>
  <text x="40" y="80" font-size="12" fill="#555">Terminal Bench 2.1, GDPval, SpreadsheetBench, DABstep · Bonsai 2 27B, Opus 5.5, Hybrid</text>

  <!-- Grid (accuracy 40–90%) -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="110" y1="120" x2="840" y2="120"/>
    <line x1="110" y1="184" x2="840" y2="184"/>
    <line x1="110" y1="248" x2="840" y2="248"/>
    <line x1="110" y1="312" x2="840" y2="312"/>
    <line x1="110" y1="376" x2="840" y2="376"/>
  </g>
  <line x1="110" y1="440" x2="840" y2="440" stroke="#9a9a9a" stroke-width="1"/>

  <g font-size="11" fill="#777" text-anchor="end">
    <text x="100" y="124">90%</text>
    <text x="100" y="188">80%</text>
    <text x="100" y="252">70%</text>
    <text x="100" y="316">60%</text>
    <text x="100" y="380">50%</text>
    <text x="100" y="444">40%</text>
  </g>
  <text transform="translate(44 280) rotate(-90)" font-size="10" fill="#555" text-anchor="middle" letter-spacing="0.5">ACCURACY</text>

  <!-- Cost axis ($0.00–$1.40) -->
  <g stroke="#9a9a9a" stroke-width="1">
    <line x1="110" y1="440" x2="110" y2="445"/>
    <line x1="214.3" y1="440" x2="214.3" y2="445"/>
    <line x1="318.6" y1="440" x2="318.6" y2="445"/>
    <line x1="422.9" y1="440" x2="422.9" y2="445"/>
    <line x1="527.1" y1="440" x2="527.1" y2="445"/>
    <line x1="631.4" y1="440" x2="631.4" y2="445"/>
    <line x1="735.7" y1="440" x2="735.7" y2="445"/>
    <line x1="840" y1="440" x2="840" y2="445"/>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="110" y="462">$0.00</text>
    <text x="214.3" y="462">$0.20</text>
    <text x="318.6" y="462">$0.40</text>
    <text x="422.9" y="462">$0.60</text>
    <text x="527.1" y="462">$0.80</text>
    <text x="631.4" y="462">$1.00</text>
    <text x="735.7" y="462">$1.20</text>
    <text x="840" y="462">$1.40</text>
  </g>
  <text x="475" y="490" font-size="10" fill="#555" text-anchor="middle" letter-spacing="0.5">API COST PER TASK (USD)</text>

  <!-- Xerxes frontier: Bonsai → Hybrid → Opus 5.5 -->
  <polyline points="130.9,324.8 276.9,184 631.4,145.6" fill="none" stroke="#a9b4b6" stroke-width="1.3"/>

  <!-- Xerxes (teal) -->
  <circle cx="130.9" cy="324.8" r="6" fill="#1f7a80"/>
  <circle cx="276.9" cy="184" r="6" fill="#ffffff" stroke="#1f7a80" stroke-width="2"/>
  <circle cx="631.4" cy="145.6" r="6" fill="#1f7a80"/>

  <!-- Hermes (dark squares) -->
  <rect x="136.3" y="351.8" width="10" height="10" fill="#2b2b2b"/>
  <rect x="772.4" y="166.2" width="10" height="10" fill="#2b2b2b"/>

  <!-- Pi (grey triangles) -->
  <polygon points="136.1,382.8 142.1,393.3 130.1,393.3" fill="#9a9a9a"/>
  <polygon points="709.6,197.2 715.6,207.7 703.6,207.7" fill="#9a9a9a"/>

  <!-- Labels -->
  <g font-size="12">
    <text x="152" y="330" fill="#1f7a80"><tspan font-weight="700">Xerxes</tspan> · Bonsai 2 27B (58%)</text>
    <text x="156" y="361" fill="#2b2b2b"><tspan font-weight="700">Hermes</tspan> · Bonsai 2 27B (53%)</text>
    <text x="152" y="393" fill="#777"><tspan font-weight="700">Pi</tspan> · Bonsai 2 27B (48%)</text>

    <text x="276.9" y="168" fill="#1f7a80" text-anchor="middle"><tspan font-weight="700">Xerxes</tspan> · Hybrid (80%)</text>
    <text x="631.4" y="130" fill="#1f7a80" text-anchor="middle"><tspan font-weight="700">Xerxes</tspan> · Opus 5.5 (86%)</text>
    <text x="840" y="156" fill="#2b2b2b" text-anchor="end"><tspan font-weight="700">Hermes</tspan> · Opus 5.5 (82%)</text>
    <text x="709.6" y="228" fill="#777" text-anchor="middle"><tspan font-weight="700">Pi</tspan> · Opus 5.5 (77%)</text>
  </g>

  <!-- Notes -->
  <g font-size="11" fill="#666">
    <text x="40" y="528">Solid line: the Xerxes cost/accuracy frontier (Bonsai → Hybrid → Opus 5.5).</text>
    <text x="40" y="546">Filled circle: Xerxes · hollow circle: Xerxes hybrid · square: Hermes · triangle: Pi.</text>
  </g>
  <line x1="40" y1="572" x2="860" y2="572" stroke="#dcdcdc" stroke-width="1"/>
  <text x="40" y="598" font-size="11" fill="#555" font-weight="700">Xerxes</text>
  <text x="860" y="598" font-size="11" fill="#777" text-anchor="end">Illustration</text>
</svg>
