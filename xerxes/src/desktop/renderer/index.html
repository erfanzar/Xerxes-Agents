<!doctype html>
<!-- The stylesheet's layout rules key off data-layout; Claude's is the only layout. -->
<html lang="en" data-layout="claude">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No remote origins: the renderer loads only what it ships with. `frame-src blob:`
         hosts workspace PDFs and sandboxed `allow-scripts` Generative UI widgets;
         `script-src 'self' data:` lets those sandboxed blob iframes run base64
         `data:text/javascript` scripts without permitting `'unsafe-inline'` in the host. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src blob:;"
    />
    <title>Xerxes Agents</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./atelier.css" />
    <!-- The one layout every style shares; style sheets below change only colour and type. -->
    <link rel="stylesheet" href="./layout.css" />
    <!-- Claude Code's layout, shared by Vibes (default) and Neo; Vibes colours and type. -->
    <link rel="stylesheet" href="./vibes.css" />
    <!-- Last: the Neo style (Settings ▸ General ▸ Style); inert unless data-style="neo". -->
    <link rel="stylesheet" href="./neo.css" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
